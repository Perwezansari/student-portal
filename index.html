<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shama Henna Classes — Student Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginView" class="auth-wrap">
  <!-- Top Right Admin Link -->
  <div class="top-nav-link">
    <a href="admin.html" class="nav-switch-btn">👑 Admin Login →</a>
  </div>

  <form id="loginForm" class="auth-card">
    <div class="brand-header">
      <img src="logo.png" alt="Shama Henna Classes Logo" class="brand-logo" onerror="this.style.display='none'">
      <h1 class="brand-title">Shama</h1>
      <span class="brand-subtitle">HENNA CLASSES</span>
    </div>

    <div class="divider"></div>

    <h2>Student Portal Login</h2>
    <p class="muted">Apna diya gaya email aur password daal kar login karein.</p>

    <label for="email">Student Email</label>
    <input type="email" id="email" required autocomplete="username" placeholder="student@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">

    <button type="submit" class="btn primary full">Login to Dashboard</button>
    <p id="loginError" class="error"></p>
    <div style="text-align: center; margin-top: 18px; font-size: 11px; color: var(--muted); letter-spacing: 0.05em; border-top: 1px dashed var(--card-border); padding-top: 12px;">
  Developed by <strong style="color: var(--primary);">Perwez</strong>
</div>
  </form>
</div>

<div id="dashboardView" style="display:none;">
  <div class="topbar">
    <div class="topbar-brand">
      <img src="logo.png" alt="Logo" class="topbar-logo" onerror="this.style.display='none'">
      <div>
        <h2>Shama Henna Classes</h2>
        <span class="muted-tag">Student Fee Register</span>
      </div>
    </div>
    <button id="logoutBtn" class="btn ghost">Logout</button>
  </div>

  <main class="container">
    <div class="card" id="dashboardContent">
      <p class="muted">Loading student records...</p>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app-student.js"></script>
</body>
</html>
