<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Verify Certificate — Shama Henna Classes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* Verification Card Core Styles */
  .verify-container {
    text-align: center;
    max-width: 400px;
    width: 100%;
  }
  
  .verify-card-premium {
    background: #ffffff;
    border: 2px solid #C49A45;
    border-radius: 12px;
    padding: 30px 20px;
    margin-top: 25px;
    box-shadow: 0 15px 35px rgba(120, 32, 43, 0.1);
    position: relative;
    text-align: center;
  }
  
  .verify-card-premium::before {
    content: '';
    position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
    border: 1px dashed #EADBCC;
    border-radius: 8px;
    pointer-events: none;
  }

  .verified-badge-premium {
    background: #1E7E34;
    color: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 25px;
    box-shadow: 0 4px 12px rgba(30, 126, 52, 0.3);
    position: relative;
    z-index: 2;
  }

  .detail-group {
    margin-bottom: 18px;
    position: relative;
    z-index: 2;
  }

  .detail-label {
    font-size: 11px;
    font-weight: 800;
    color: #C49A45;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
  }

  .detail-value {
    font-size: 16px;
    font-weight: 700;
    color: #450B12;
  }

  .detail-value.name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 32px;
    font-weight: 700;
    color: #78202B;
    letter-spacing: 0.5px;
  }

  .footer-details {
    display: flex;
    justify-content: space-between;
    margin-top: 25px;
    border-top: 1px solid #EADBCC;
    padding-top: 15px;
  }
  
  .footer-left { text-align: left; }
  .footer-right { text-align: right; }
  .footer-value { font-size: 14px; font-weight: 700; color: #450B12; }

  /* Instagram Action Button (Moved Outside) */
  .insta-cta-wrapper {
    margin-top: 30px;
    position: relative;
    z-index: 2;
  }
  
  .insta-text {
    font-size: 11px;
    font-weight: 800;
    color: #7A6E6D;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  
  .insta-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    color: #ffffff;
    padding: 12px 28px;
    border-radius: 30px;
    font-size: 14.5px;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 6px 15px rgba(220, 39, 67, 0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  
  .insta-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(220, 39, 67, 0.4);
    color: #ffffff;
  }
  
  .insta-btn svg {
    width: 18px;
    height: 18px;
  }

  /* Official Organization Footer */
  .official-copyright-footer {
    margin-top: 35px;
    padding-top: 15px;
    border-top: 1px solid rgba(196, 154, 69, 0.25);
    font-size: 10.5px;
    font-weight: 600;
    color: #9E9493;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    line-height: 1.6;
  }

  .official-copyright-footer strong {
    color: #78202B;
  }

  .security-registry-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    margin-top: 8px;
    color: #1E7E34;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    background: rgba(30, 126, 52, 0.08);
    padding: 4px 10px;
    border-radius: 20px;
  }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="top-nav-link">
    <a href="index.html" class="nav-switch-btn"> Student Portal →</a>
  </div>

  <div class="auth-card verify-container">
    <div class="brand-header">
      <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
      <h1 class="brand-title">Shama</h1>
      <span class="brand-subtitle">HENNA CLASSES</span>
    </div>
    
    <div id="verifyContent" class="verify-content-wrapper">
      <p class="muted">Scanning official database...</p>
    </div>

    <!-- Official Copyright & Security Registry -->
    <div class="official-copyright-footer">
      &copy; <script>document.write(new Date().getFullYear())</script> <strong>Shama Henna Classes</strong>.<br> All Rights Reserved.
      <div class="security-registry-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        Secure Verification Registry
      </div>
    </div>

  </div>
</div>

<!-- Firebase SDK Integration -->
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const certId = urlParams.get('id');
  const verifyContent = document.getElementById('verifyContent');

  if (!certId) {
    verifyContent.innerHTML = `<p class="error">❌ Invalid QR Code. Authentication ID is missing.</p>`;
  } else {
    db.collection('certificates').doc(certId).get().then((doc) => {
      if (doc.exists) {
        const data = doc.data();
        const displayCertId = data.certNumber ? data.certNumber : certId; 

        const rawDate = new Date(data.issueDate);
        const formattedDate = rawDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

        verifyContent.innerHTML = `
          <div class="verify-card-premium">
            <div class="verified-badge-premium">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              Officially Verified
            </div>
            
            <div class="detail-group">
              <div class="detail-label">Proudly Presented To</div>
              <div class="detail-value name">${data.studentName}</div>
            </div>
            
            <div class="detail-group">
              <div class="detail-label">For Completion Of</div>
              <div class="detail-value">${data.courseName}</div>
            </div>
            
            <div class="footer-details detail-group" style="margin-bottom: 0;">
              <div class="footer-left">
                <div class="detail-label">Issue Date</div>
                <div class="footer-value">${formattedDate}</div>
              </div>
              <div class="footer-right">
                <div class="detail-label">Certificate No.</div>
                <div class="footer-value">${displayCertId}</div>
              </div>
            </div>
          </div>

          <!-- Instagram Community Link (Moved Outside the Box) -->
          <div class="insta-cta-wrapper">
            <p class="insta-text">Connect with Us</p>
            <a href="https://instagram.com/shamahennaclasses" target="_blank" class="insta-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
              </svg>
              Follow on Instagram
            </a>
          </div>
        `;
      } else {
        verifyContent.innerHTML = `<p class="error">❌ No matching certificate found in our official records.</p>`;
      }
    }).catch((error) => {
      console.error(error);
      verifyContent.innerHTML = `<p class="error">⚠️ Network error. Please verify your connection.</p>`;
    });
  }
</script>
</body>
</html>
