<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Verify Certificate — Shama Henna Classes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* Premium Certificate Verification Card Styling */
  .verify-container {
    text-align: center;
    max-width: 400px;
    width: 100%;
  }
  
  .verify-card-premium {
    background: #ffffff;
    border: 2px solid #C49A45;
    border-radius: 12px;
    padding: 30px 20px;
    margin-top: 25px;
    box-shadow: 0 15px 35px rgba(120, 32, 43, 0.1);
    position: relative;
    text-align: center;
  }
  
  /* Inner Dashed Border */
  .verify-card-premium::before {
    content: '';
    position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
    border: 1px dashed #EADBCC;
    border-radius: 8px;
    pointer-events: none;
  }

  .verified-badge-premium {
    background: #1E7E34;
    color: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 25px;
    box-shadow: 0 4px 12px rgba(30, 126, 52, 0.3);
    position: relative;
    z-index: 2;
  }

  .detail-group {
    margin-bottom: 18px;
    position: relative;
    z-index: 2;
  }

  .detail-label {
    font-size: 11px;
    font-weight: 800;
    color: #C49A45;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
  }

  .detail-value {
    font-size: 16px;
    font-weight: 700;
    color: #450B12;
  }

  .detail-value.name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 32px;
    font-weight: 700;
    color: #78202B;
    letter-spacing: 0.5px;
  }

  .footer-details {
    display: flex;
    justify-content: space-between;
    margin-top: 25px;
    border-top: 1px solid #EADBCC;
    padding-top: 15px;
  }
  
  .footer-left { text-align: left; }
  .footer-right { text-align: right; }
  .footer-value { font-size: 14px; font-weight: 700; color: #450B12; }

  /* Professional WhatsApp Share Button */
  .btn-whatsapp {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #25D366;
    color: #ffffff;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 14.5px;
    font-weight: 700;
    margin-top: 20px;
    box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3);
    transition: all 0.25s ease;
    width: 100%;
  }

  .btn-whatsapp:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(37, 211, 102, 0.45);
  }

  .btn-whatsapp svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="top-nav-link">
    <a href="index.html" class="nav-switch-btn">🔐 Student Portal →</a>
  </div>

  <div class="auth-card verify-container">
    <div class="brand-header">
      <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
      <h1 class="brand-title">Shama</h1>
      <span class="brand-subtitle">HENNA CLASSES</span>
    </div>
    
    <div id="verifyContent" class="verify-content-wrapper">
      <p class="muted">Scanning official database...</p>
    </div>
  </div>
</div>

<!-- Firebase Service Connectors -->
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
  // Process incoming verification request via URL parameter
  const urlParams = new URLSearchParams(window.location.search);
  const certId = urlParams.get('id');
  const verifyContent = document.getElementById('verifyContent');

  if (!certId) {
    verifyContent.innerHTML = `<p class="error">❌ Invalid QR Code. Authentication ID is missing.</p>`;
  } else {
    // Validate secure ID against Firestore database
    db.collection('certificates').doc(certId).get().then((doc) => {
      if (doc.exists) {
        const data = doc.data();
        const displayCertId = data.certNumber ? data.certNumber : certId; 

        // Convert standard date (YYYY-MM-DD) to a premium readable format (e.g., 14 Sep 2026)
        const rawDate = new Date(data.issueDate);
        const formattedDate = rawDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

        // Generate WhatsApp Share URL dynamically
        const currentUrl = window.location.href;
        const shareMessage = `I have successfully completed the ${data.courseName} at Shama Henna Classes! 🎓✨\n\nVerify my official certificate here:\n${currentUrl}`;
        const whatsappLink = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareMessage)}`;

        verifyContent.innerHTML = `
          <div class="verify-card-premium">
            <div class="verified-badge-premium">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              Officially Verified
            </div>
            
            <div class="detail-group">
              <div class="detail-label">Proudly Presented To</div>
              <div class="detail-value name">${data.studentName}</div>
            </div>
            
            <div class="detail-group">
              <div class="detail-label">For Completion Of</div>
              <div class="detail-value">${data.courseName}</div>
            </div>
            
            <div class="footer-details detail-group">
              <div class="footer-left">
                <div class="detail-label">Issue Date</div>
                <div class="footer-value">${formattedDate}</div>
              </div>
              <div class="footer-right">
                <div class="detail-label">Certificate No.</div>
                <div class="footer-value">${displayCertId}</div>
              </div>
            </div>
          </div>
          
          <!-- Professional WhatsApp Share Action -->
          <a href="${whatsappLink}" target="_blank" rel="noopener noreferrer" class="btn-whatsapp">
            <svg viewBox="0 0 24 24">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
            </svg>
            Share on WhatsApp
          </a>
        `;
      } else {
        verifyContent.innerHTML = `<p class="error">❌ No matching certificate found in our official records.</p>`;
      }
    }).catch((error) => {
      console.error(error);
      verifyContent.innerHTML = `<p class="error">⚠️ Network error. Please verify your connection.</p>`;
    });
  }
</script>
</body>
</html>
